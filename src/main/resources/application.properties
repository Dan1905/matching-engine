spring.application.name=matching-engine

spring.datasource.url=jdbc:postgresql://localhost:5432/matching_engine
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

spring.data.redis.host=localhost
spring.data.redis.port=6379

server.port=8080

logging.level.com.trading.matching_engine=DEBUG

# --- engine ---------------------------------------------------------------
# Rebuild the in-memory book from Postgres at startup. Disable only for a cold
# start against an empty book (benchmarks, a fresh environment).
engine.recovery.enabled=true

# Write events Postgres has refused after every retry are appended here rather
# than dropped. A non-empty file means a replay is outstanding.
engine.persistence.dead-letter-file=data/failed-writes.tsv
